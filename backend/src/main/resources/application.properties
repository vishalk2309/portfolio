server.port=${PORT:8080}
spring.application.name=portfolio-ai-backend

# Google Gemini Configuration
# Spring Boot automatically maps SPRING_AI_GOOGLE_GENERATIVEAI_API_KEY env var to this property
spring.ai.google.generativeai.api-key=${SPRING_AI_GOOGLE_GENERATIVEAI_API_KEY}
spring.ai.google.generativeai.chat.options.model=gemini-1.5-flash
spring.ai.google.generativeai.chat.options.temperature=0.7

# Logging
logging.level.root=INFO
logging.level.com.portfolio.ai=DEBUG

# JSON formatting
spring.mvc.log-request-details=true

# Render configuration
server.servlet.context-path=/api
