server.port=${PORT:8080}
spring.application.name=portfolio-ai-backend

# Google Gemini Configuration
spring.ai.google.ai.gemini.api-key=${SPRING_AI_GOOGLE_GENERATIVEAI_API_KEY}
spring.ai.google.ai.gemini.chat.options.model=gemini-1.5-flash

# Logging
logging.level.root=INFO
logging.level.com.portfolio.ai=DEBUG

# Render configuration
server.servlet.context-path=/api
